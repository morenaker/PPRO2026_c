services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ordinace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordinace_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ordinace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ordinace}:${POSTGRES_PASSWORD:-ordinace_dev}@db:5432/${POSTGRES_DB:-ordinace}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Zdrojáky se mountují kvůli vývoji; změna kódu se projeví po restartu kontejneru.
    volumes:
      - ./app:/srv/app
      - ./tests:/srv/tests
      - ./alembic:/srv/alembic

volumes:
  pgdata:
